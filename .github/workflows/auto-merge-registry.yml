name: Process Skill Registration / Deletion

on:
  issues:
    types: [opened]

concurrency:
  group: registry-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  register:
    if: startsWith(github.event.issue.title, 'register:')
    runs-on: ubuntu-latest
    steps:
      # Always check out the current tip of main, not the SHA from when the
      # issue was opened — otherwise concurrent issues would each see stale
      # registry.json and the second commit would conflict on rebase.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Parse issue and update registry
        run: |
          python3 << 'SCRIPT'
          import json, re, os, sys
          from datetime import datetime, timezone

          body = os.environ.get('ISSUE_BODY', '')
          author_login = os.environ.get('ISSUE_AUTHOR', '')

          # Parse form fields from issue body. Bound each value to its own
          # Markdown heading so an empty field cannot consume the next label.
          def parse_field(text, field_id):
              pattern = rf'^###\s+{re.escape(field_id)}\s*\n(.*?)(?=^###\s+|\Z)'
              m = re.search(pattern, text, re.IGNORECASE | re.MULTILINE | re.DOTALL)
              if m:
                  val = m.group(1).strip()
                  if val.lower() in ('_no response_', 'n/a', 'none', ''):
                      return ''
                  return val
              return ''

          name = parse_field(body, 'Skill name')
          repo = parse_field(body, 'GitHub repo URL')
          path = parse_field(body, 'Path to Skill folder') or '.'
          entry_type = parse_field(body, 'Type') or 'skill'
          agent_name = parse_field(body, 'Agent name') or ''
          author = parse_field(body, 'Your GitHub username') or author_login
          description = parse_field(body, 'Description') or ''
          version = parse_field(body, 'Version') or ''
          tags_str = parse_field(body, 'Tags') or ''
          metadata_verification = parse_field(body, 'Metadata verification') or ''
          tags = [t.strip() for t in tags_str.split(',') if t.strip()] if tags_str else []
          metadata_unverified = metadata_verification.strip().lower() in (
              'unverified',
              'submit-anyway',
              'submit anyway',
              'form metadata',
              'form-metadata',
          )

          # Normalize type
          entry_type = entry_type.strip().lower()
          if entry_type not in ('skill', 'agent'):
              entry_type = 'skill'

          # Validate
          errors = []
          if not name:
              errors.append('Missing skill name')
          if not repo:
              errors.append('Missing repo URL')
          else:
              repo_match = re.match(r'^https://github\.com/([^/]+)/([^/?#]+?)(?:\.git)?/?(?:[?#].*)?$', repo)
              if repo_match:
                  repo = f'https://github.com/{repo_match.group(1)}/{repo_match.group(2)}'
              else:
                  errors.append(f'Invalid repo URL "{repo}" — must be a GitHub URL')
          if not author:
              errors.append('Missing author')
          if metadata_unverified and not description:
              errors.append('Description is required for Submit anyway submissions so the website can show a card')

          if errors:
              msg = 'Registration failed:\\n' + '\\n'.join(f'- {e}' for e in errors)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'comment={msg}\n')
                  f.write('success=false\n')
              print(msg, file=sys.stderr)
              sys.exit(0)

          # Load registry
          with open('registry.json') as f:
              registry = json.load(f)

          def entry_identity(item):
              item_type = (item.get('type') or 'skill').strip().lower()
              item_name = (item.get('name') or '').strip()
              item_agent = (item.get('agent') or '').strip() if item_type == 'skill' else ''
              return (item_type, item_agent, item_name)

          def entry_label(item):
              item_type, item_agent, item_name = entry_identity(item)
              if item_type == 'skill' and item_agent:
                  return f'{item_agent}/{item_name}'
              return item_name

          # Build entry
          entry = {
              'name': name,
              'type': entry_type,
              'repo': repo,
              'path': path,
              'author': author,
          }
          if description:
              entry['description'] = description
          if version:
              entry['version'] = version
          if tags:
              entry['tags'] = tags
          if metadata_unverified:
              entry['metadataUnverified'] = True
              entry['metadataWarning'] = (
                  'Repository metadata was not verified during submission; '
                  'this card uses form metadata.'
              )
          agent_pending = False
          if agent_name and entry_type == 'skill':
              # Always record the agent linkage. If the agent isn't registered
              # yet, it will be picked up automatically once it appears in the
              # registry — the frontend filters unknown agent names at render time.
              entry['agent'] = agent_name
              agent_pending = not any(
                  s['name'] == agent_name and s.get('type') == 'agent'
                  for s in registry['skills']
              )

          # Check for duplicates by registry identity. Child skills are scoped
          # by their parent agent, so different agents can register skills with
          # the same display name without overwriting one another.
          target_identity = entry_identity(entry)
          existing = [s for s in registry['skills'] if entry_identity(s) == target_identity]
          if existing:
              entry['updatedAt'] = datetime.now(timezone.utc).isoformat()
              entry['registeredAt'] = existing[0].get('registeredAt', entry['updatedAt'])
              existing[0].update(entry)
              action = 'updated'
          else:
              entry['registeredAt'] = datetime.now(timezone.utc).isoformat()
              registry['skills'].append(entry)
              action = 'registered'

          with open('registry.json', 'w') as f:
              json.dump(registry, f, indent=2, ensure_ascii=False)

          comment = f'Successfully {action} **{entry_label(entry)}** by @{author}'
          if agent_pending:
              comment += (
                  f'\\n\\nNote: parent agent **{agent_name}** is not registered yet. '
                  f'This skill will be linked automatically once that agent is registered.'
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'comment={comment}\n')
              f.write('success=true\n')

          print(f'{action}: {entry_label(entry)} by @{author}')
          SCRIPT
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        id: register

      - name: Commit registry update
        if: steps.register.outputs.success == 'true'
        run: |
          git config user.name "StudyClawHub Bot"
          git config user.email "bot@studyclawhub"
          git add registry.json
          git commit -m "register: add skill from #${{ github.event.issue.number }}"
          git pull --rebase origin main
          git push

      - name: Trigger index rebuild
        if: steps.register.outputs.success == 'true'
        continue-on-error: true
        run: gh workflow run build-index.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.register.outputs.success }}' === 'true';
            const body = success
              ? '✅ ${{ steps.register.outputs.comment }}\n\nThe skills index will be rebuilt shortly. Your Skill will appear on the website within a few minutes.'
              : '❌ ${{ steps.register.outputs.comment }}\n\nPlease fix the errors and open a new issue.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

  delete:
    if: startsWith(github.event.issue.title, 'delete:')
    runs-on: ubuntu-latest
    steps:
      # See note above (register job) — always start from latest main.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check repo permission
        id: perms
        run: |
          PERM=$(gh api repos/${{ github.repository }}/collaborators/${{ github.event.issue.user.login }}/permission --jq .permission 2>/dev/null || echo "none")
          echo "permission=$PERM" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse and delete from registry
        run: |
          python3 << 'SCRIPT'
          import json, re, os, sys

          title = os.environ.get('ISSUE_TITLE', '')
          issue_author = os.environ.get('ISSUE_AUTHOR', '')
          repo_permission = os.environ.get('REPO_PERMISSION', 'none')

          def entry_identity(item):
              item_type = (item.get('type') or 'skill').strip().lower()
              item_name = (item.get('name') or '').strip()
              item_agent = (item.get('agent') or '').strip() if item_type == 'skill' else ''
              return (item_type, item_agent, item_name)

          def entry_label(item):
              item_type, item_agent, item_name = entry_identity(item)
              if item_type == 'skill' and item_agent:
                  return f'{item_agent}/{item_name}'
              return item_name

          # Extract package name from title. For duplicate child skill names,
          # use "delete: agent-name/skill-name" to target a specific child.
          m = re.match(r'^delete:\s*(.+)$', title.strip(), re.IGNORECASE)
          if not m:
              msg = 'Could not parse skill name from issue title.'
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'comment={msg}\n')
                  f.write('success=false\n')
              print(msg, file=sys.stderr)
              sys.exit(1)

          raw_name = m.group(1).strip()
          agent_name = ''
          name = raw_name
          if '/' in raw_name:
              agent_name, name = [part.strip() for part in raw_name.split('/', 1)]

          # Load registry
          with open('registry.json') as f:
              registry = json.load(f)

          # Find the entry
          matches = [
              s for s in registry['skills']
              if s.get('name') == name and (not agent_name or (s.get('agent') or '') == agent_name)
          ]
          if not agent_name and len(matches) > 1:
              choices = ', '.join(entry_label(s) for s in matches)
              msg = f'Deletion target **{name}** is ambiguous. Use one of: {choices}'
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'comment={msg}\n')
                  f.write('success=false\n')
              print(msg, file=sys.stderr)
              sys.exit(1)
          entry = matches[0] if matches else None
          if not entry:
              msg = f'Skill **{raw_name}** not found in registry.'
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'comment={msg}\n')
                  f.write('success=false\n')
              print(msg, file=sys.stderr)
              sys.exit(1)

          # Auth check: must be the author OR have write/admin permission on the repo
          is_admin = repo_permission in ('admin', 'write')
          is_author = issue_author.lower() == entry.get('author', '').lower()
          if not is_admin and not is_author:
              msg = f'Permission denied. Only the author (@{entry.get("author")}) or repo admins can delete **{entry_label(entry)}**.'
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'comment={msg}\n')
                  f.write('success=false\n')
              print(msg, file=sys.stderr)
              sys.exit(1)

          # If deleting an agent, also remove its child skills
          removed_entries = [entry]
          if entry.get('type') == 'agent':
              removed_entries.extend(s for s in registry['skills'] if s.get('agent') == name)

          removed_identities = {entry_identity(s) for s in removed_entries}
          removed = [entry_label(s) for s in removed_entries]
          registry['skills'] = [s for s in registry['skills'] if entry_identity(s) not in removed_identities]

          with open('registry.json', 'w') as f:
              json.dump(registry, f, indent=2, ensure_ascii=False)

          if len(removed) > 1:
              msg = f'Deleted agent **{name}** and {len(removed)-1} child skill(s): {", ".join(removed[1:])}'
          else:
              msg = f'Deleted **{removed[0]}** from registry.'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'comment={msg}\n')
              f.write('success=true\n')

          print(msg)
          SCRIPT
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_PERMISSION: ${{ steps.perms.outputs.permission }}
        id: delete

      - name: Commit registry update
        if: steps.delete.outputs.success == 'true'
        run: |
          git config user.name "StudyClawHub Bot"
          git config user.email "bot@studyclawhub"
          git add registry.json
          git commit -m "delete: remove skill from #${{ github.event.issue.number }}"
          git pull --rebase origin main
          git push

      - name: Trigger index rebuild
        if: steps.delete.outputs.success == 'true'
        continue-on-error: true
        run: gh workflow run build-index.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.delete.outputs.success }}' === 'true';
            const body = success
              ? '✅ ${{ steps.delete.outputs.comment }}'
              : '❌ ${{ steps.delete.outputs.comment }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
