name: Build Skills Index

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild index every 6 hours to pick up changes in student repos
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skills-index.json
        run: |
          python3 << 'SCRIPT'
          import json, urllib.request, urllib.error, re, sys, os
          from datetime import datetime, timezone

          GH_TOKEN = os.environ.get('GH_TOKEN') or os.environ.get('GITHUB_TOKEN') or ''

          def request_headers():
              headers = {
                  'User-Agent': 'StudyClawHub-Bot',
                  'Accept': 'application/vnd.github.v3+json',
              }
              if GH_TOKEN:
                  headers['Authorization'] = f'Bearer {GH_TOKEN}'
              return headers

          def fetch_text(url):
              req = urllib.request.Request(url, headers=request_headers())
              with urllib.request.urlopen(req, timeout=10) as resp:
                  return resp.read().decode('utf-8')

          def fetch_json(url):
              try:
                  return json.loads(fetch_text(url))
              except Exception:
                  return {}

          def clean_path(path):
              return '' if path in ('', '.') else str(path).strip().strip('/')

          def unique(values):
              seen = set()
              out = []
              for val in values:
                  if val and val not in seen:
                      seen.add(val)
                      out.append(val)
              return out

          def metadata_files(entry_type):
              return ['AGENTS.md', 'CLAUDE.md'] if entry_type == 'agent' else ['SKILL.md']

          def raw_metadata_url(repo_path, branch, path, md_file):
              clean = clean_path(path)
              if clean:
                  return f'https://raw.githubusercontent.com/{repo_path}/{branch}/{clean}/{md_file}'
              return f'https://raw.githubusercontent.com/{repo_path}/{branch}/{md_file}'

          def load_metadata(repo_path, path, entry_type, preferred_branch='', preferred_file=''):
              files = metadata_files(entry_type)
              if preferred_file in files:
                  files = [preferred_file] + [f for f in files if f != preferred_file]

              repo_data = fetch_json(f'https://api.github.com/repos/{repo_path}')
              default_branch = repo_data.get('default_branch', '')
              branches = unique([preferred_branch, default_branch, 'main', 'master'])

              for branch in branches:
                  for md_file in files:
                      try:
                          content = fetch_text(raw_metadata_url(repo_path, branch, path, md_file))
                      except Exception:
                          continue
                      fm_match = re.match(r'^---\s*\n(.*?)\n---\s*\n(.*)', content, re.DOTALL)
                      meta = parse_frontmatter(fm_match.group(1)) if fm_match else {}
                      return meta, branch, md_file
              return None, '', ''

          def parse_frontmatter(text):
              """Parse simple YAML frontmatter without PyYAML dependency."""
              meta = {}
              current_key = None
              for line in text.strip().splitlines():
                  # YAML list item: "  - value"
                  list_m = re.match(r'^\s+-\s+(.*)', line)
                  if list_m and current_key is not None:
                      if not isinstance(meta[current_key], list):
                          meta[current_key] = []
                      meta[current_key].append(list_m.group(1).strip().strip("'\""))
                      continue
                  # Key-value pair
                  m = re.match(r'^(\w+)\s*:\s*(.*)', line)
                  if not m:
                      current_key = None
                      continue
                  key, val = m.group(1), m.group(2).strip()
                  current_key = key
                  # Empty value — might be followed by list items
                  if not val:
                      meta[key] = ''
                  # Quoted string — return as-is (don't split on commas)
                  elif (val.startswith('"') and val.endswith('"')) or \
                       (val.startswith("'") and val.endswith("'")):
                      meta[key] = val[1:-1]
                  # List values like: [hub, submit]
                  elif val.startswith('[') and val.endswith(']'):
                      meta[key] = [v.strip().strip("'\"") for v in val[1:-1].split(',')]
                  # Unquoted comma-separated → list (e.g. tags: hub, submit)
                  elif ',' in val:
                      meta[key] = [v.strip() for v in val.split(',')]
                  else:
                      meta[key] = val
              return meta

          with open('registry.json') as f:
              registry = json.load(f)

          skills = []
          for entry in registry.get('skills', []):
              repo = entry.get('repo', '')
              path = entry.get('path', '.')
              author = entry.get('author', '')
              name = entry.get('name', '')
              entry_type = entry.get('type', 'skill')

              # Extract owner/repo from URL
              match = re.match(r'https://github\.com/([^/]+)/([^/?#]+?)(?:\.git)?/?(?:[?#].*)?$', repo)
              if not match:
                  print(f"Skipping {name}: invalid repo URL", file=sys.stderr)
                  continue

              repo_path = f"{match.group(1)}/{match.group(2)}"

              meta, metadata_branch, metadata_file = load_metadata(
                  repo_path,
                  path,
                  entry_type,
                  entry.get('metadataBranch', ''),
                  entry.get('metadataFile', ''),
              )
              used_fallback_metadata = False
              if meta is None:
                  # Use metadata from registry.json as fallback (e.g. private
                  # repos, submit-anyway, or temporarily unreachable repos).
                  if name and author:
                      used_fallback_metadata = True
                      meta = {}
                      print(f"{name}: using registry metadata (could not fetch repository metadata)")
                  else:
                      expected = ' or '.join(metadata_files(entry_type))
                      print(f"Skipping {name}: could not fetch {expected} and no registry metadata", file=sys.stderr)
                      continue

              # Fetch star count from GitHub API
              stars = 0
              try:
                  api_url = f"https://api.github.com/repos/{repo_path}"
                  repo_data = fetch_json(api_url)
                  stars = repo_data.get('stargazers_count', 0)
              except:
                  pass

              skill_name = meta.get("name", name)
              entry_type = entry.get("type", "skill")
              skill_entry = {
                  "name": skill_name,
                  "type": entry_type,
                  "description": meta.get("description", entry.get("description", "")),
                  "author": meta.get("author", author),
                  "version": meta.get("version", entry.get("version", "1.0.0")),
                  "tags": meta.get("tags", entry.get("tags", [])),
                  "repo": repo,
                  "repo_name": repo_path.split('/')[-1],
                  "path": path,
                  "registeredAt": entry.get("registeredAt", ""),
                  "stars": stars,
              }
              if metadata_branch:
                  skill_entry["metadataBranch"] = metadata_branch
              if metadata_file:
                  skill_entry["metadataFile"] = metadata_file
              if entry.get("metadataUnverified") or used_fallback_metadata:
                  skill_entry["metadataUnverified"] = True
                  skill_entry["metadataWarning"] = entry.get(
                      "metadataWarning",
                      "Repository metadata was not verified during submission; this card uses form metadata."
                  )
              if entry.get("agent"):
                  skill_entry["agent"] = entry["agent"]
              skills.append(skill_entry)

              print(f"Indexed: {meta.get('name', name)} by @{meta.get('author', author)}")

          index = {
              "version": 1,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "count": len(skills),
              "skills": skills
          }

          with open('skills-index.json', 'w') as f:
              json.dump(index, f, indent=2, ensure_ascii=False)

          print(f"\nDone: {len(skills)} skills indexed.")
          SCRIPT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Copy index to site
        run: cp skills-index.json site/skills-index.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
